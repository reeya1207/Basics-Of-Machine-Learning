<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>#Reet_Ka_IshQ — Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1a2744;
      --rose: #c48a7a;
      --cream: #f7f1ea;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #0b0d12;
      color: #fff;
      font-family: "Outfit", sans-serif;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1rem 2rem;
      background:
        radial-gradient(ellipse at 20% 0%, #24314f 0%, transparent 45%),
        radial-gradient(ellipse at 80% 100%, #3a2430 0%, transparent 40%),
        #0b0d12;
    }
    header {
      text-align: center;
      margin-bottom: 1rem;
    }
    header h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
    }
    header p {
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
      margin-top: 0.35rem;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin: 0.5rem 0 1rem;
    }
    .tabs button {
      border: 1px solid rgba(255,255,255,0.25);
      background: transparent;
      color: #fff;
      border-radius: 999px;
      padding: 0.45rem 1rem;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .tabs button.active {
      background: var(--cream);
      color: var(--navy);
      border-color: var(--cream);
    }
    .player-shell {
      width: min(100%, 960px);
      display: grid;
      place-items: center;
    }
    .player-shell[data-mode="mobile"] {
      width: min(100%, 420px);
    }
    video {
      width: 100%;
      height: auto;
      max-height: min(78dvh, 860px);
      background: #111;
      border-radius: 10px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      display: block;
    }
    .player-shell[data-mode="mobile"] video {
      max-height: min(82dvh, 920px);
      aspect-ratio: 9 / 16;
      object-fit: contain;
      background: #000;
    }
    .hint {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.55);
      text-align: center;
      max-width: 36rem;
      line-height: 1.45;
    }
    a.live {
      color: var(--rose);
    }
  </style>
</head>
<body>
  <header>
    <h1>#Reet_Ka_IshQ</h1>
    <p>1 month to go · Mahabaleshwar · 4 Dec 2026</p>
  </header>

  <div class="tabs">
    <button type="button" id="tab-auto" class="active">Auto</button>
    <button type="button" id="tab-desktop">Desktop 16:9</button>
    <button type="button" id="tab-mobile">Mobile 9:16</button>
  </div>

  <div class="player-shell" id="shell" data-mode="desktop">
    <video id="player" controls playsinline webkit-playsinline preload="metadata"></video>
  </div>

  <p class="hint">
    Auto picks vertical for phones and landscape for desktops.
    Prefer the interactive version?
    <a class="live" href="index.html">Open live animation</a>
  </p>

  <script>
    const DESKTOP = "videos/reet-ka-ishq-desktop.mp4";
    const MOBILE = "videos/reet-ka-ishq-mobile.mp4";
    const DESKTOP_ALT = "../output/reet-ka-ishq-desktop.mp4";
    const MOBILE_ALT = "../output/reet-ka-ishq-mobile.mp4";

    const player = document.getElementById("player");
    const shell = document.getElementById("shell");
    let mode = "auto";

    function preferMobile() {
      return window.matchMedia("(orientation: portrait), (max-width: 820px)").matches;
    }

    async function resolveSrc(primary, alt) {
      try {
        const r = await fetch(primary, { method: "HEAD" });
        if (r.ok) return primary;
      } catch {}
      return alt;
    }

    async function load(kind) {
      const useMobile = kind === "mobile" || (kind === "auto" && preferMobile());
      const src = useMobile
        ? await resolveSrc(MOBILE, MOBILE_ALT)
        : await resolveSrc(DESKTOP, DESKTOP_ALT);
      shell.dataset.mode = useMobile ? "mobile" : "desktop";
      const t = player.currentTime || 0;
      const wasPlaying = !player.paused;
      if (player.getAttribute("src") !== src) {
        player.src = src;
        player.load();
        player.addEventListener("loadedmetadata", () => {
          try { player.currentTime = Math.min(t, player.duration || t); } catch {}
          if (wasPlaying) player.play().catch(() => {});
        }, { once: true });
      }
      document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
      document.getElementById(kind === "auto" ? "tab-auto" : kind === "mobile" ? "tab-mobile" : "tab-desktop")
        .classList.add("active");
    }

    document.getElementById("tab-auto").onclick = () => { mode = "auto"; load("auto"); };
    document.getElementById("tab-desktop").onclick = () => { mode = "desktop"; load("desktop"); };
    document.getElementById("tab-mobile").onclick = () => { mode = "mobile"; load("mobile"); };

    const mq = window.matchMedia("(orientation: portrait), (max-width: 820px)");
    const onChange = () => { if (mode === "auto") load("auto"); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else mq.addListener(onChange);

    load("auto");
  </script>
</body>
</html>
